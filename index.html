var IMG={},loaded=0,loadFailed=false;
['hero','monster','attack','swords'].forEach(function(n){
  var im=new Image();
  im.onload=function(){loaded++;};
  im.onerror=function(){loadFailed=true;loaded++;};
  im.src=SPRITES[n];
  IMG[n]=im;
});
function spr(name,row,col,flip){
  var m=SPR[name],im=IMG[name];
  return {im:im,sx:col*m.cellw,sy:m.rows[row]*m.cellh,sw:m.cellw,sh:m.cellh,flip:!!flip};
}
function drawSpr(s,x,y,h,alpha){
  // anchor bottom-center at (x,y), drawn at height h (keep aspect)
  var w=h*s.sw/s.sh;
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.translate(x,y-h/2);
  if(s.flip)ctx.scale(-1,1);
  ctx.drawImage(s.im,s.sx,s.sy,s.sw,s.sh,-w/2,-h/2,w,h);
  ctx.restore();
}

// ---------- world ----------
var WW=2600,WH=2600;
var BRIDGE_Y=1300,BRIDGE_HALF=64;
var MTN={x:1300,y:170},HOUSE={x:1300,y:400};
function riverX(y){return 1580+300*Math.sin(y/280)+70*Math.sin(y/90);}
function inRiver(x,y){
  if(Math.abs(y-BRIDGE_Y)<BRIDGE_HALF)return false;
  return Math.abs(x-riverX(y))<88;
}
function validSpot(x,y){return x>70&&x<WW-70&&y>70&&y<WH-70&&!inRiver(x,y);}

var trees=[],rocks=[],flowers=[],bushes=[],chests=[];
var SPAWN={x:600,y:1300};
function placeTrees(){
  var n=0,tries=0;
  while(n<95&&tries<3000){
    tries++;
    var x=rand()*WW,y=rand()*WH;
    if(!validSpot(x,y))continue;
    if(Math.abs(y-1300)<58||Math.abs(x-600)<48)continue;
    if(dist(x,y,SPAWN.x,SPAWN.y)<230)continue;
    if(dist(x,y,HOUSE.x,HOUSE.y)<200)continue;
    if(y<560&&Math.abs(x-MTN.x)<560)continue;
    trees.push({x:x,y:y,s:0.8+rand()*0.6});
    n++;
  }
}
function placeSimple(arr,count){
  var n=0,tries=0;
  while(n<count&&tries<2000){
    tries++;
    var x=rand()*WW,y=rand()*WH;
    if(!validSpot(x,y))continue;
    if(y<560&&Math.abs(x-MTN.x)<560)continue;
    arr.push({x:x,y:y,c:rand()});
    n++;
  }
}
function placeChests(){
  var n=0,tries=0;
  while(n<8&&tries<4000){
    tries++;
    var x=rand()*WW,y=rand()*WH;
    if(!validSpot(x,y))continue;
    if(dist(x,y,SPAWN.x,SPAWN.y)<260)continue;
    if(y<560&&Math.abs(x-MTN.x)<560)continue;
    var ok=true;
    for(var i=0;i<chests.length;i++){if(dist(x,y,chests[i].x,chests[i].y)<260){ok=false;break;}}
    if(!ok)continue;
    chests.push({x:x,y:y,open:false,anim:0});
    n++;
  }
}
placeTrees();placeSimple(rocks,26);placeSimple(flowers,140);placeSimple(bushes,30);placeChests();

// ---------- static world render ----------
var staticC=document.createElement('canvas');
staticC.width=WW;staticC.height=WH;
var sctx=staticC.getContext('2d');
function drawTree(g,t){
  g.fillStyle='#6d4520';
  g.fillRect(t.x-4*t.s,t.y-2*t.s,8*t.s,16*t.s);
  var s=t.s;
  g.fillStyle='#2f7d3a';
  g.beginPath();g.arc(t.x-10*s,t.y-18*s,13*s,0,7);g.fill();
  g.beginPath();g.arc(t.x+10*s,t.y-18*s,13*s,0,7);g.fill();
  g.fillStyle='#3f9e4d';
  g.beginPath();g.arc(t.x,t.y-26*s,16*s,0,7);g.fill();
  g.fillStyle='#58b968';
  g.beginPath();g.arc(t.x-4*s,t.y-30*s,7*s,0,7);g.fill();
}
function drawMountain(g){
  var x=MTN.x,y=MTN.y;
  // big mountain: layered triangles with snow cap
  g.fillStyle='#7a7f8a';
  g.beginPath();g.moveTo(x-620,y+330);g.lineTo(x-140,y-40);g.lineTo(x+60,y+330);g.closePath();g.fill();
  g.fillStyle='#8b909b';

// ---------- entities ----------
var hero,mons,coins,pickups,parts,floats,found,banner,bannerT;
var started,gameOver,shakeT,chestsOpened,kills;
// hero action state: 'idle','walk','jump','slide','crouch','attack','death'
function makeMon(type,x,y){
  return {type:type,x:x,y:y,hp:type==='A'?30:40,maxhp:type==='A'?30:40,
    dmg:type==='A'?3:5,spd:type==='A'?55:42,
    t:rand()*10,wt:0,wx:x,wy:y,hurt:0,dead:false,deathT:0,atkT:0,atkCd:0,face:1};
}
function spawnPoint(minD){
  var x,y,tries=0;
  do{x=rand()*WW;y=rand()*WH;tries++;}while((!validSpot(x,y)||dist(x,y,hero.x,hero.y)<(minD||380)||(y<560&&Math.abs(x-MTN.x)<560))&&tries<2000);
  return {x:x,y:y};
}
function wave1(){
  for(var i=0;i<3;i++){var p=spawnPoint(380);mons.push(makeMon('A',p.x,p.y));}
  addFloat(hero.x,hero.y-40,'Monsters coming!','#ffb04d');
}
function wave2(){
  for(var i=0;i<2;i++){var p=spawnPoint(380);mons.push(makeMon('B',p.x,p.y));}
  var p=spawnPoint(380);mons.push(makeMon('A',p.x,p.y));
  addFloat(hero.x,hero.y-40,'Bigger monsters!','#ff6b6b');
}
function waveMixed(){
  for(var i=0;i<2;i++){var p=spawnPoint(380);mons.push(makeMon('A',p.x,p.y));}
  for(i=0;i<2;i++){p=spawnPoint(380);mons.push(makeMon('B',p.x,p.y));}
  addFloat(hero.x,hero.y-40,'More monsters!','#ffb04d');
}
function resetGame(){
  hero={x:SPAWN.x,y:SPAWN.y,speed:185,dir:0,face:1,walk:0,
    hp:25,maxhp:25,weapon:1,
    state:'idle',stateT:0,jumpY:0,slideDir:0,crouching:false,
    attackT:0,attackStyle:0,cd:0,inv:0,deathT:0};
  mons=[];coins=[];pickups=[];parts=[];floats=[];
  chestsOpened=0;kills=0;found=false;banner='';bannerT=0;
  gameOver=false;shakeT=0;
  for(var i=0;i<chests.length;i++){chests[i].open=false;chests[i].anim=0;}
  wave1();
}
resetGame();
started=false;

function spawnSparkle(x,y,color,n){
  for(var i=0;i<n;i++){
    var a=rand()*Math.PI*2,sp=40+rand()*90;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,t:0,life:0.5+rand()*0.3,color:color,size:2+rand()*3});
  }
}
function spawnCoins(x,y,n){
  for(var i=0;i<n;i++){
    var a=rand()*Math.PI*2,d=18+rand()*30;
    coins.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,t:rand()*10});
  }
}
function addFloat(x,y,txt,color){floats.push({x:x,y:y,txt:txt,t:0,color:color});}

var ATTACK_STYLES=['s1','s2','s3','s4'];
var ATTACK_DUR=0.42;
function attack(){
  if(gameOver||!started||found==='pause')return;
  if(hero.cd>0||hero.state==='death')return;
  if(hero.state==='slide'||hero.state==='jump'||hero.crouching)return;
  hero.cd=0.45;hero.attackT=ATTACK_DUR;
  hero.state='attack';hero.stateT=0;
  hero.attackStyle=(hero.attackStyle+1)%4;
  var power=hero.weapon*10;
  var row=ATTACK_STYLES[hero.attackStyle];
  hero.atkRow=row;
  // hit lands mid-swing
  hero.hitPending=0.16;
  hero.atkPower=power;
}
function applyHit(){
  var power=hero.atkPower;
  var reach=92,anyHit=false;
  for(var i=0;i<mons.length;i++){
    var m=mons[i];
    if(m.dead)continue;
    var d=dist(hero.x,hero.y,m.x,m.y);
    if(d<reach&&angDiff(Math.atan2(m.y-hero.y,m.x-hero.x),hero.dir)<1.3){
      anyHit=true;
      m.hp-=power;m.hurt=0.22;
      var a=Math.atan2(m.y-hero.y,m.x-hero.x);
      m.x+=Math.cos(a)*34;m.y+=Math.sin(a)*34;
      spawnSparkle(m.x,m.y-10,'#fff36b',8);
      addFloat(m.x,m.y-40,'-'+power,'#ffffff');
      if(m.hp<=0){
        m.dead=true;m.deathT=0;
        kills++;
        spawnSparkle(m.x,m.y-10,'#ff9ecb',14);
        spawnCoins(m.x,m.y,2+Math.floor(rand()*3));
        // +5 max HP permanently
        hero.maxhp+=5;hero.hp=Math.min(hero.maxhp,hero.hp+5);
        addFloat(hero.x,hero.y-56,'+5 MAX HP','#7dff8a');
        // 30% chance: 10 HP drop
        if(rand()<0.3){pickups.push({x:m.x+24,y:m.y+10,kind:'hp',t:0});addFloat(m.x,m.y-64,'HP drop!','#ff8fa0');}
        // weapon unlock: next sword each kill, up to 9
        if(hero.weapon<9){
          hero.weapon++;
          addFloat(hero.x,hero.y-76,'Sword '+hero.weapon+' unlocked!','#ffd24d');
          spawnSparkle(hero.x,hero.y-20,'#ffd24d',12);
        }
      }
    }
  }
  if(anyHit)shakeT=Math.max(shakeT,0.12);
}
function damageHero(fromX,fromY,amount){
  if(hero.inv>0||gameOver||hero.state==='death')return;
  if(hero.state==='jump'||hero.state==='slide')return; // airborne / sliding dodge
  hero.hp-=amount;hero.inv=1.2;shakeT=0.25;
  var a=Math.atan2(hero.y-fromY,hero.x-fromX);
  hero.x+=Math.cos(a)*36;hero.y+=Math.sin(a)*36;
  spawnSparkle(hero.x,hero.y-16,'#ff6b6b',10);
  addFloat(hero.x,hero.y-40,'-'+amount,'#ff6b6b');
  if(hero.hp<=0){hero.hp=0;hero.state='death';hero.deathT=0;}
}
function doJump(){
  if(gameOver||!started||hero.cd>0&&hero.state==='attack')return;
  if(hero.state!=='idle'&&hero.state!=='walk')return;
  hero.state='jump';hero.stateT=0;
}
function doSlide(){
  if(gameOver||!started)return;
  if(hero.state!=='idle'&&hero.state!=='walk')return;
  hero.state='slide';hero.stateT=0;hero.slideDir=hero.dir;
  spawnSparkle(hero.x,hero.y,'#c9c9c9',6);
}

// ---------- update ----------
function update(dt){
  var i;
  for(i=0;i<parts.length;i++){var p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;}
  parts=parts.filter(function(p){return p.t<p.life;});
  for(i=0;i<floats.length;i++){floats[i].t+=dt;}
  floats=floats.filter(function(f){return f.t<1.4;});
  if(shakeT>0)shakeT-=dt;
  if(bannerT>0)bannerT-=dt;
  if(!started)return;

  if(hero.state==='death'){
    hero.deathT+=dt;
    if(hero.deathT>1.4)gameOver=true;
    return;
  }
  if(gameOver)return;

  if(hero.cd>0)hero.cd-=dt;
  if(hero.inv>0)hero.inv-=dt;
  if(hero.attackT>0){
    hero.attackT-=dt;
    if(hero.hitPending!=null){hero.hitPending-=dt;if(hero.hitPending<=0){applyHit();hero.hitPending=null;}}
    if(hero.attackT<=0){hero.state='idle';}
  }

  var mx=joyVec.x,my=joyVec.y;
  if(keys.ArrowLeft||keys.a)mx-=1;
  if(keys.ArrowRight||keys.d)mx+=1;
  if(keys.ArrowUp||keys.w)my-=1;
  if(keys.ArrowDown||keys.s)my+=1;
  var ml=Math.hypot(mx,my);
  if(ml>1){mx/=ml;my/=ml;}
  var moving=ml>0.05;

  hero.crouching=crouchHeld&&hero.state!=='jump'&&hero.state!=='slide'&&hero.state!=='attack';

  // state timers
  if(hero.state==='jump'){
    hero.stateT+=dt;
    var J=0.62;
    var t=hero.stateT/J;
    if(t>=1){hero.state='idle';hero.jumpY=0;}
    else{hero.jumpY=Math.sin(t*Math.PI)*46;}
  }else if(hero.state==='slide'){
    hero.stateT+=dt;
    var S=0.38;
    if(hero.stateT>=S){hero.state='idle';}
    else{
      var sp=340;
      var nx=hero.x+Math.cos(hero.slideDir)*sp*dt;
      var ny=hero.y+Math.sin(hero.slideDir)*sp*dt;
      nx=Math.max(24,Math.min(WW-24,nx));ny=Math.max(24,Math.min(WH-24,ny));
      if(!inRiver(nx,hero.y))hero.x=nx;
      if(!inRiver(hero.x,ny))hero.y=ny;
    }
  }

  if(moving&&hero.state!=='attack'&&hero.state!=='slide'&&!hero.crouching){
    var spd=hero.speed*(hero.state==='jump'?1.1:1);
    var nx=hero.x+mx*spd*dt;
    var ny=hero.y+my*spd*dt;
    nx=Math.max(24,Math.min(WW-24,nx));
    ny=Math.max(24,Math.min(WH-24,ny));
    if(!inRiver(nx,hero.y)||hero.state==='jump')hero.x=nx;
    if(!inRiver(hero.x,ny)||hero.state==='jump')hero.y=ny;
    hero.dir=Math.atan2(my,mx);
    if(Math.abs(mx)>0.05)hero.face=mx>0?1:-1;
    hero.walk+=dt*10;
    if(hero.state==='idle')hero.state='walk';
    if(hero.state==='walk'&&!moving)hero.state='idle';
  }else if(hero.state==='walk'&&!moving){hero.state='idle';}

  // house goal
  if(!found&&dist(hero.x,hero.y,HOUSE.x,HOUSE.y+40)<70){
    found=true;
    banner='You found the house!';bannerT=4;
    spawnSparkle(HOUSE.x,HOUSE.y-30,'#ffd24d',24);
    addFloat(hero.x,hero.y-50,'Home at last!','#ffd24d');
  }

  // chests
  for(i=0;i<chests.length;i++){
    var ch=chests[i];
    if(!ch.open&&dist(hero.x,hero.y,ch.x,ch.y)<44){
      ch.open=true;ch.anim=0;chestsOpened++;
      spawnCoins(ch.x,ch.y,5);
      spawnSparkle(ch.x,ch.y-10,'#ffd24d',16);
      addFloat(ch.x,ch.y-34,'Treasure!','#ffd24d');
    }
    if(ch.open&&ch.anim<1)ch.anim=Math.min(1,ch.anim+dt*3);
  }

  // monsters
  var alive=0;
  for(i=0;i<mons.length;i++){
    var m=mons[i];
    if(m.dead){m.deathT+=dt;continue;}
    alive++;
    m.t+=dt;
    if(m.atkCd>0)m.atkCd-=dt;
    if(m.hurt>0){m.hurt-=dt;continue;}
    var d=dist(hero.x,hero.y,m.x,m.y);
    if(m.atkT>0){
      m.atkT-=dt;
      if(m.atkT<=0&&d<64)damageHero(m.x,m.y,m.dmg);
      continue;
    }
    if(d<200&&!hero.crouching&&hero.state!=='death'){
      var vx=(hero.x-m.x)/d,vy=(hero.y-m.y)/d;
      m.x+=vx*m.spd*dt;m.y+=vy*m.spd*dt;
      m.face=vx>=0?1:-1;
      if(d<52&&m.atkCd<=0){m.atkT=0.45;m.atkCd=1.1;}
    }else{
      m.wt-=dt;
      if(m.wt<=0){m.wt=2+rand()*3;m.wx=m.x+(rand()-0.5)*160;m.wy=m.y+(rand()-0.5)*160;}
      var dw=dist(m.x,m.y,m.wx,m.wy);
      if(dw>6){var wx2=(m.wx-m.x)/dw,wy2=(m.wy-m.y)/dw;m.x+=wx2*28*dt;m.y+=wy2*28*dt;m.face=wx2>=0?1:-1;}
    }
    if(inRiver(m.x,m.y)){m.x+=30*dt;m.wx=m.x;m.wy=m.y;}
  }
  mons=mons.filter(function(m){return !m.dead||m.deathT<1.2;});
  if(alive===0&&mons.length>=0){
    var anyAlive=false;
    for(i=0;i<mons.length;i++)if(!mons[i].dead)anyAlive=true;
    if(!anyAlive){
      if(kills<3){/* still wave1 monsters alive check */}
      // next wave
      if(!hero._wave)hero._wave=1;
      hero._wave++;
      if(hero._wave===2)wave2();else waveMixed();
    }
  }

  // coins
  for(i=0;i<coins.length;i++){
    var c=coins[i];c.t+=dt;
    var dc=dist(hero.x,hero.y,c.x,c.y);
    if(dc<70){c.x+=(hero.x-c.x)/dc*260*dt;c.y+=(hero.y-c.y)/dc*260*dt;}
    if(dc<20){c.got=true;hero.coins=(hero.coins||0)+1;spawnSparkle(c.x,c.y,'#ffd24d',4);}
  }
  coins=coins.filter(function(c){return !c.got;});

  // hp pickups
  for(i=0;i<pickups.length;i++){
    var h=pickups[i];h.t+=dt;
    if(dist(hero.x,hero.y,h.x,h.y)<26){
      h.got=true;
      hero.hp=Math.min(hero.maxhp,hero.hp+10);
      addFloat(hero.x,hero.y-40,'+10 HP','#ff8fa0');
      spawnSparkle(h.x,h.y,'#ff8fa0',8);
    }
  }
  pickups=pickups.filter(function(h){return !h.got;});
}

// ---------- draw ----------
function drawCoin(c){
  var bob=Math.sin(c.t*5)*3;
  ctx.fillStyle='#e0a41e';ctx.beginPath();ctx.arc(c.x,c.y-6+bob,8,0,7);ctx.fill();
  ctx.fillStyle='#ffd24d';ctx.beginPath();ctx.arc(c.x,c.y-7+bob,7,0,7);ctx.fill();
  ctx.fillStyle='#e0a41e';ctx.beginPath();ctx.arc(c.x,c.y-7+bob,3.5,0,7);ctx.fill();
}
function drawChest(ch){
  var x=ch.x,y=ch.y;
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(x,y+12,20,6,0,0,7);ctx.fill();
  ctx.fillStyle='#8a5a2e';roundRect(ctx,x-17,y-8,34,20,4);ctx.fill();
  ctx.fillStyle='#ffd24d';ctx.fillRect(x-17,y-1,34,4);
  if(ch.open){
    ctx.fillStyle='#3a2410';ctx.fillRect(x-15,y-6,30,6);
    ctx.save();ctx.translate(x,y-8);ctx.rotate(-0.9*ch.anim);

    ctx.fillStyle='#ffd24d';ctx.fillRect(-17,-6,34,3);
    ctx.restore();
    ctx.fillStyle='rgba(255,224,102,'+(0.5*Math.sin(ch.anim*20)*0.3+0.35)+')';
    ctx.beginPath();ctx.arc(x,y-10,14,0,7);ctx.fill();
  }else{
    ctx.fillStyle='#a9743f';roundRect(ctx,x-17,y-14,34,10,4);ctx.fill();
    ctx.fillStyle='#ffd24d';ctx.fillRect(x-17,y-11,34,3);
    ctx.beginPath();ctx.arc(x,y-4,4,0,7);ctx.fill();
    ctx.fillStyle='#8a6d1f';ctx.beginPath();ctx.arc(x,y-4,2,0,7);ctx.fill();
  }
}
function drawMon(m){
  var MH=58;
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath();ctx.ellipse(m.x,m.y+4,26,8,0,0,7);ctx.fill();
  var s;
  if(m.dead){
    var row=m.type==='A'?'Ad':'Bd';
    s=spr('monster',row,0,m.face<0);
    drawSpr(s,m.x,m.y+2,MH,Math.max(0,1-m.deathT/1.1));
    return;
  }
  if(m.atkT>0){
    var row2=m.type==='A'?'Aa':'Ba';
    var prog=1-m.atkT/0.45;
    var fi=Math.min(2,Math.floor(prog*3));
    s=spr('monster',row2,fi,m.face<0);
    drawSpr(s,m.x,m.y+2,MH*1.35,m.hurt>0?0.6:1);
  }else{
    var row3=m.type==='A'?'Aw':'Bw';
    var fi2=Math.floor(m.t*6)%4;
    s=spr('monster',row3,fi2,m.face<0);
    drawSpr(s,m.x,m.y+2,MH,m.hurt>0?0.55:1);
  }
  // hp bar
  var w=44,pct=Math.max(0,m.hp/m.maxhp);
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(m.x-w/2,m.y-MH-14,w,6);
  ctx.fillStyle=m.type==='A'?'#ffb04d':'#ff5c5c';
  ctx.fillRect(m.x-w/2+1,m.y-MH-13,(w-2)*pct,4);
}
function drawHeroSprite(){
  var x=hero.x,y=hero.y-hero.jumpY;
  var blink=hero.inv>0&&Math.floor(hero.inv*12)%2===0;
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();ctx.ellipse(hero.x,hero.y+4,13,5,0,0,7);ctx.fill();
  var HH=64;
  if(hero.state==='death'){
    var fi=Math.min(2,Math.floor(hero.deathT/0.45));
    drawSpr(spr('hero','death',fi,hero.face<0),x,y+2,HH,1-Math.min(1,hero.deathT/1.3)*0.4);
    return;
  }
  if(blink)return;
  var flip=hero.face<0;
  if(hero.state==='attack'){
    // warrior attack sprite, bigger
    var prog=1-hero.attackT/ATTACK_DUR;
    var fi2=Math.min(3,Math.floor(prog*4));
    drawSpr(spr('attack',hero.atkRow,fi2,flip),x+hero.face*14,y+2,96,1);
    return;
  }
  if(hero.state==='jump'){
    drawSpr(spr('hero','jump',0,flip),x,y+2,HH*0.9,1);
    return;
  }
  if(hero.state==='slide'){
    var fi3=Math.min(2,Math.floor(hero.stateT/0.13));
    drawSpr(spr('hero','slide',fi3,flip),x,y+2,HH*0.8,1);
    return;
  }
  if(hero.crouching){
    var fi4=Math.min(2,Math.floor(performance.now()/300)%3);
    drawSpr(spr('hero','crouch',fi4,flip),x,y+2,HH*0.85,1);
    return;
  }
  if(hero.state==='walk'){
    drawSpr(spr('hero','walk',Math.floor(hero.walk)%8,flip),x,y+2,HH,1);
  }else{
    drawSpr(spr('hero','idle',Math.floor(performance.now()/450)%2,flip),x,y+2,HH,1);
  }
  // current sword in hand
  var swd=spr('swords','s',hero.weapon-1,false);
  ctx.save();
  ctx.translate(x+hero.face*16,y-20);
  ctx.rotate(hero.face*0.7);
  drawSpr(swd,0,0,26,1);
  ctx.restore();
}
function drawSwordIcon(x,y,size){
  var swd=spr('swords','s',hero.weapon-1,false);
  ctx.save();ctx.translate(x,y);ctx.rotate(-Math.PI/4);
  drawSpr(swd,0,0,size,1);
  ctx.restore();
}

function draw(){
  var camX=Math.max(0,Math.min(WW-vw,hero.x-vw/2));
  var camY=Math.max(0,Math.min(WH-vh,hero.y-vh/2));
  if(vw>=WW)camX=(WW-vw)/2;
  if(vh>=WH)camY=(WH-vh)/2;
  if(shakeT>0){camX+=(Math.random()-0.5)*shakeT*30;camY+=(Math.random()-0.5)*shakeT*30;}
  ctx.fillStyle='#2e7d32';ctx.fillRect(0,0,vw,vh);
  ctx.drawImage(staticC,camX,camY,vw,vh,0,0,vw,vh);
  ctx.save();ctx.translate(-camX,-camY);
  var i;
  for(i=0;i<chests.length;i++)drawChest(chests[i]);
  for(i=0;i<coins.length;i++)drawCoin(coins[i]);
  for(i=0;i<pickups.length;i++){
    var h=pickups[i];
    var bob=Math.sin(h.t*5)*3;
    ctx.fillStyle='#ff5c72';
    ctx.beginPath();ctx.arc(h.x,h.y-8+bob,9,0,7);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillRect(h.x-5,h.y-10+bob,10,4);ctx.fillRect(h.x-2,h.y-13+bob,4,10);
  }
  var render=[];
  for(i=0;i<mons.length;i++)render.push(mons[i]);
  render.push({y:hero.y,hero:true});
  render.sort(function(a,b){return a.y-b.y;});
  for(i=0;i<render.length;i++){
    if(render[i].hero)drawHeroSprite();else drawMon(render[i]);
  }
  for(i=0;i<parts.length;i++){
    var p=parts[i];
    ctx.globalAlpha=1-p.t/p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(i=0;i<floats.length;i++){
    var f=floats[i];
    ctx.globalAlpha=Math.max(0,1-f.t/1.4);
    ctx.font='bold 16px system-ui,sans-serif';
    ctx.strokeStyle='rgba(0,0,0,0.55)';ctx.lineWidth=3;
    ctx.strokeText(f.txt,f.x,f.y-14-f.t*22);
    ctx.fillStyle=f.color;
    ctx.fillText(f.txt,f.x,f.y-14-f.t*22);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  // ----- HUD -----
  // HP bar
  ctx.fillStyle='rgba(0,0,0,0.45)';
  roundRect(ctx,14,14,170,30,15);ctx.fill();
  var pct=hero.maxhp>0?hero.hp/hero.maxhp:0;
  ctx.fillStyle='#3a1010';roundRect(ctx,20,21,158,16,8);ctx.fill();
  ctx.fillStyle=pct>0.35?'#ff4d5e':'#ff2222';
  if(pct>0){roundRect(ctx,20,21,158*pct,16,8);ctx.fill();}
  ctx.fillStyle='#fff';ctx.font='bold 13px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText(hero.hp+' / '+hero.maxhp,99,34);
  // sword + power
  ctx.fillStyle='rgba(0,0,0,0.45)';
  roundRect(ctx,vw-150,14,136,40,18);ctx.fill();
  drawSwordIcon(vw-126,34,30);
  ctx.fillStyle='#ffd24d';ctx.font='bold 13px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText('Sword '+hero.weapon,vw-106,30);
  ctx.fillStyle='#fff';
  ctx.fillText('Power '+(hero.weapon*10),vw-106,46);
  // coins
  ctx.fillStyle='rgba(0,0,0,0.45)';
  roundRect(ctx,vw-150,60,136,32,16);ctx.fill();
  ctx.fillStyle='#e0a41e';ctx.beginPath();ctx.arc(vw-130,76,10,0,7);ctx.fill();
  ctx.fillStyle='#ffd24d';ctx.beginPath();ctx.arc(vw-130,76,8,0,7);ctx.fill();
  ctx.fillStyle='#e0a41e';ctx.beginPath();ctx.arc(vw-130,76,4,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText(String(hero.coins||0),vw-112,82);

  // house banner
  if(bannerT>0){
    ctx.globalAlpha=Math.min(1,bannerT);
    ctx.fillStyle='rgba(0,0,0,0.55)';
    roundRect(ctx,vw/2-170,70,340,52,14);ctx.fill();
    ctx.fillStyle='#ffd24d';ctx.font='bold 20px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText(banner,vw/2,103);
    ctx.globalAlpha=1;
  }

  // controls
  if(started&&!gameOver&&hero.state!=='death'){
    var jx=joyActive?joyBase.x:88;
    var jy=joyActive?joyBase.y:vh-100;
    var kx=jx+joyVec.x*46,ky=jy+joyVec.y*46;
    ctx.globalAlpha=joyActive?0.5:0.22;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(jx,jy,52,0,7);ctx.fill();
    ctx.globalAlpha=joyActive?0.75:0.35;
    ctx.beginPath();ctx.arc(kx,ky,24,0,7);ctx.fill();
    ctx.globalAlpha=1;
    var sb=swordBtn();
    ctx.fillStyle=hero.cd>0?'rgba(255,255,255,0.12)':'rgba(255,255,255,0.3)';
    ctx.beginPath();ctx.arc(sb.x,sb.y,sb.r,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(sb.x,sb.y,sb.r,0,7);ctx.stroke();
    ctx.save();ctx.translate(sb.x,sb.y);ctx.rotate(-Math.PI/4);
    drawSpr(spr('swords','s',hero.weapon-1,false),0,0,44,1);
    ctx.restore();
    drawBtn(jumpBtn(),'JUMP',hero.state==='jump');
    drawBtn(slideBtn(),'SLIDE',hero.state==='slide');
    drawBtn(crouchBtn(),'DUCK',hero.crouching);
  }
}

// ---------- input ----------
var joyActive=false,joyId=null,joyBase={x:0,y:0},joyVec={x:0,y:0};
var keys={};
var crouchHeld=false;
function pressAt(x,y){
  if(phase==='intro'){introScene++;introT=0;if(introScene>=INTRO.length)phase='title';return;}
  if(phase==='title'){phase='play';started=true;return;}
  if(!started)return;
  if(gameOver){resetGame();return;}
  var sb=swordBtn(),jb=jumpBtn(),lb=slideBtn(),cb=crouchBtn();
  if(dist(x,y,sb.x,sb.y)<sb.r+22){attack();return;}
  if(dist(x,y,jb.x,jb.y)<jb.r+16){doJump();return;}
  if(dist(x,y,lb.x,lb.y)<lb.r+16){doSlide();return;}
  if(dist(x,y,cb.x,cb.y)<cb.r+16){crouchHeld=true;return;}
}
canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(phase!=='play'){pressAt(t.clientX,t.clientY);continue;}
    if(!started||gameOver){pressAt(t.clientX,t.clientY);continue;}
    var cb=crouchBtn();
    if(dist(t.clientX,t.clientY,cb.x,cb.y)<cb.r+16){crouchHeld=true;crouchId=t.identifier;continue;}
    pressAt(t.clientX,t.clientY);
    if(!joyActive&&t.clientX<vw*0.55){
      joyActive=true;joyId=t.identifier;joyBase={x:t.clientX,y:t.clientY};joyVec={x:0,y:0};
    }
  }
},{passive:false});
var crouchId=null;
canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(joyActive&&t.identifier===joyId){
      var dx=t.clientX-joyBase.x,dy=t.clientY-joyBase.y;
      var l=Math.hypot(dx,dy);
      if(l>10){var m=Math.min(l,50);joyVec={x:dx/l*(m/50),y:dy/l*(m/50)};}
      else joyVec={x:0,y:0};
    }
  }
},{passive:false});
function touchEnd(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var id=e.changedTouches[i].identifier;
    if(joyActive&&id===joyId){joyActive=false;joyId=null;joyVec={x:0,y:0};}
    if(crouchId===id){crouchHeld=false;crouchId=null;}
  }
}
canvas.addEventListener('touchend',touchEnd,{passive:false});
canvas.addEventListener('touchcancel',touchEnd,{passive:false});
canvas.addEventListener('mousedown',function(e){pressAt(e.clientX,e.clientY);
  if(phase==='play'&&started&&!gameOver&&!joyActive&&e.clientX<vw*0.55){joyActive=true;joyId='m';joyBase={x:e.clientX,y:e.clientY};joyVec={x:0,y:0};}
  if(phase==='play'&&started&&!gameOver&&dist(e.clientX,e.clientY,crouchBtn().x,crouchBtn().y)<crouchBtn().r+16){crouchHeld=true;}
});
canvas.addEventListener('mousemove',function(e){
  if(joyActive&&joyId==='m'){
    var dx=e.clientX-joyBase.x,dy=e.clientY-joyBase.y;
    var l=Math.hypot(dx,dy);
    if(l>10){var m=Math.min(l,50);joyVec={x:dx/l*(m/50),y:dy/l*(m/50)};}
    else joyVec={x:0,y:0};
  }
});
window.addEventListener('mouseup',function(){if(joyId==='m'){joyActive=false;joyId=null;joyVec={x:0,y:0};}crouchHeld=false;});
window.addEventListener('keydown',function(e){
  keys[e.key]=true;
  if(e.key===' '){attack();e.preventDefault();}
  if(e.key==='Shift'){crouchHeld=true;}
  if(e.key==='j'||e.key==='ArrowUp'&&e.getModifierState('Control'))doJump();
});
window.addEventListener('keyup',function(e){keys[e.key]=false;if(e.key==='Shift')crouchHeld=false;});
document.addEventListener('contextmenu',function(e){e.preventDefault();});

// ---------- loop ----------
var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000);
  last=now;
  if(phase==='load'){
    if(loaded>=4){phase='intro';introT=0;introScene=0;}
    drawLoad();
  }else if(phase==='intro'){
    introT+=dt;
    if(introT>6){introScene++;introT=0;if(introScene>=INTRO.length)phase='title';}
    drawIntro();
  }else{
    update(dt);
    draw();
    if(phase==='title')drawTitle();
    if(gameOver)drawGameOver();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
